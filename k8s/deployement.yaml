apiVersion: apps/v1
kind: Deployment
metadata:
 name: practical-app
spec:
 replicas: 2
 selector:
 matchLabels:
 app: practical-app
 template:
 metadata:
 labels:
 app: practical-app
 spec:
 containers:
 - name: practical-app
 image: krithika2013/k8s-practical-app:7d04a454c92d94c28ec0d13f5f134fd77f89f6ff
 ports:
 - containerPort: 5000
 readinessProbe:
 httpGet:
 path: /health
 port: 5000
 initialDelaySeconds: 5
 periodSeconds: 5

